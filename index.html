<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>保护环境，从我做起</title>
    <style>
        body {
            margin: 0;
            font-family: "微软雅黑", Arial, sans-serif;
            background-color: #f4f9f4;
            color: #333;
        }
        header {
            background-color: #2e8b57;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        nav {
            background-color: #3cb371;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 30px;
            max-width: 900px;
            margin: auto;
        }
        h2 {
            color: #2e8b57;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #2e8b57;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>保护环境，从我做起</h1>
    <p>珍爱地球，共建绿色家园</p>
</header>

<nav>
    <a href="#importance">环境的重要性</a>
    <a href="#actions">我们能做什么</a>
    <a href="#future">绿色未来</a>
</nav>

<div class="container">
    <div class="card" id="importance">
        <h2>🌍 环境的重要性</h2>
        <p>
            环境是人类赖以生存的基础。清新的空气、干净的水源、
            健康的生态系统对我们的生活至关重要。
            保护环境就是保护我们自己。
        </p>
    </div>

    <div class="card" id="actions">
        <h2>♻️ 我们能做什么</h2>
        <ul>
            <li>节约用水、用电，减少资源浪费</li>
            <li>垃圾分类，减少塑料使用</li>
            <li>绿色出行，多步行、骑车或乘坐公共交通</li>
            <li>爱护动植物，不破坏自然生态</li>
        </ul>
    </div>

    <div class="card" id="future">
        <h2>🌱 绿色未来</h2>
        <p>
            只要每个人都贡献一点力量，
            我们就能拥有蓝天、白云、清水和绿地。
            让环保成为一种习惯，让地球更加美好。
        </p>
    </div>
</div>

<footer>
    <p>© 2026 保护环境网页示例 | 绿色生活，从现在开始</p>
</footer>

</body>
</html>
